<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação Básica</title>
</head>
<body>
  <h2>Formulário com Validação</h2>
  <form onsubmit="return validarFormulario()">
    <input type="text" id="nome" placeholder="Nome completo" required /><br><br>
    <input type="email" id="email" placeholder="E-mail" required /><br><br>
    <button type="submit">Enviar</button>
  </form>

  <script>
    function validarFormulario() {
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();

      if (nome.length < 3) {
        alert("O nome deve conter pelo menos 3 caracteres.");
        return false;
      }

      if (!email.includes("@") || !email.includes(".")) {
        alert("Informe um e-mail válido.");
        return false;
      }

      alert("Formulário enviado com sucesso!");
      return true;
    }
  </script>
</body>
</html>
